tmdb:
  api_key: "${TMDB_API_KEY}"
  base_url: "https://api.themoviedb.org/3"
  image_base_url: "https://image.tmdb.org/t/p/w500"

deepseek:
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"

recommendation:
  top_k_movies: 100
  final_recommendations: 10
  imdb_weight: 0.3
  tfidf_weight: 0.2
  watch_history_weight: 0.5
  semantic_similarity_threshold: 0.7
  semantic_weight: 0.3
  stage1_candidates: 100
  stage1_max_tmdb_results: 200
  history_boost_factor: 0.3
  max_same_genre: 3
  max_same_director: 2

data:
  tmdb_5000_path: "data/tmdb_5000_movies.csv"
  tmdb_5000_credits_path: "data/tmdb_5000_credits.csv"
  movielens_tags_path: "data/genome-tags.csv"
  movielens_relevance_path: "data/genome-scores.csv"
