tmdb:
  api_key: "${TMDB_API_KEY}"
  base_url: "https://api.themoviedb.org/3"
  image_base_url: "https://image.tmdb.org/t/p/w500"

kado:
  api_key: "${KADO_API_KEY}"
  base_url: "https://awesome.kado.so/openai/v1"
  model: "kado"

deepseek:
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://awesome.kado.so/openai/v1"
  model: "kado"

recommendation:
  top_k_movies: 100
  final_recommendations: 1
  imdb_weight: 0.30
  tfidf_weight: 0.25
  semantic_weight: 0.35
  popularity_weight: 0.10
  semantic_model_name: "multi-qa-mpnet-base-dot-v1"
  stage1_candidates: 100
  stage1_max_tmdb_results: 200
  history_boost_factor: 0.3
  max_same_genre: 3
  max_same_director: 2

data:
  db_path: "movie_features.db"
  manifest_path: "data/movie_db_manifest.json"
